name: Retail Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  JAVA_VERSION:   "11"

jobs:

  # ── 1. Lint & Code Quality ─────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff black mypy

      - name: Ruff lint
        run: ruff check ingestion/ spark_jobs/ tests/ airflow/

      - name: Black format check
        run: black --check ingestion/ spark_jobs/ tests/ airflow/


  # ── 2. PySpark Unit Tests ──────────────────────────────────────────────────
  spark-tests:
    name: PySpark Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:  ${{ env.JAVA_VERSION }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install pyspark==3.5.1 pytest pytest-cov chispa loguru

      - name: Run Spark unit tests
        run: |
          pytest tests/test_spark_transforms.py \
            --cov=spark_jobs \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false


  # ── 3. dbt Compile Check ───────────────────────────────────────────────────
  dbt-compile:
    name: dbt Compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.8.0

      - name: dbt compile (no DB connection needed)
        working-directory: ./dbt
        run: |
          # Use dummy target that bypasses Snowflake connection
          dbt compile --target dev --profiles-dir . 2>&1 | tail -20
        env:
          SNOWFLAKE_ACCOUNT:  dummy
          SNOWFLAKE_USER:     dummy
          SNOWFLAKE_PASSWORD: dummy


  # ── 4. Docker Build Check ─────────────────────────────────────────────────
  docker-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config --quiet


  # ── 5. Security Scan ───────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit -r ingestion/ spark_jobs/ \
            --skip B101,B105 \
            --severity-level medium


  # ── 6. Integration Summary ────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, spark-tests, dbt-compile, docker-check, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.spark-tests.result }}" != "success" ||
                "${{ needs.dbt-compile.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed — safe to merge"
